name: Resumo mensal do RH

on:
  schedule:
    - cron: "0 12 1 * *"
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Disparar resumo mensal por e-mail
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "APP_URL ou CRON_SECRET não configurados — pulando"
            exit 0
          fi
          curl -fsS -X POST "${APP_URL%/}/api/jobs/monthly-report" \
            -H "Authorization: Bearer ${CRON_SECRET}"
